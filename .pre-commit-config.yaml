# Install once: uv run pre-commit install
# Uses the ruff pinned in uv.lock (no separate hook version to keep in sync).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: scan-personal
        name: personal data and secrets scan
        entry: scripts/scan-personal.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: docs-paths
        name: docs and agent config paths
        entry: uv run python scripts/check_docs.py
        language: system
        pass_filenames: false
        files: ^(.*\.md|\.claude/.*|Makefile)$
      - id: codemap-current
        name: generated code map is current
        entry: uv run python scripts/gen_codemap.py --check
        language: system
        pass_filenames: false
        files: ^(orbit/.*\.py|tests/test_.*\.py|migrations/versions/.*|scripts/gen_codemap\.py|docs/(CODEMAP|ROUTES|CONFIG|TESTMAP)\.md)$
