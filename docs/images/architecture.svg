<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Orbit architecture</title>
  <desc id="d">Sources feed a context layer; Claude workflows return structured output that becomes proposals in an Inbox; the owner confirms before anything is written.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .gate{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .llm{fill:#fef3c7;stroke:#d97706;stroke-width:1.5}
      .store{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}
      .t{font-size:14px;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .h{font-size:12px;font-weight:700;fill:#64748b;letter-spacing:.06em}
      .l{stroke:#475569;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="900" height="540" fill="#f8fafc"/>

  <text class="h" x="30" y="30">SOURCES (untrusted text)</text>
  <rect class="box" x="30" y="42" width="170" height="52" rx="8"/><text class="t" x="44" y="64">Bank CSV</text><text class="s" x="44" y="82">Tatra, Revolut</text>
  <rect class="box" x="30" y="104" width="170" height="52" rx="8"/><text class="t" x="44" y="126">CalDAV / CardDAV</text><text class="s" x="44" y="144">calendar, contacts</text>
  <rect class="box" x="30" y="166" width="170" height="52" rx="8"/><text class="t" x="44" y="188">Dictation, notes</text><text class="s" x="44" y="206">web, Shortcuts</text>
  <rect class="box" x="30" y="228" width="170" height="52" rx="8"/><text class="t" x="44" y="250">School, fitness, sleep</text><text class="s" x="44" y="268">pages, feeds, exports</text>

  <rect class="store" x="290" y="42" width="190" height="238" rx="10"/>
  <text class="t" x="305" y="68" font-weight="700">Orbit core (FastAPI)</text>
  <text class="s" x="305" y="90">parsers and importers</text>
  <text class="s" x="305" y="108">domain models, services</text>
  <text class="s" x="305" y="126">SQLite or Postgres</text>
  <text class="s" x="305" y="144">job queue, scheduler</text>
  <text class="s" x="305" y="170" font-weight="700">Context layer</text>
  <text class="s" x="305" y="188">typed, bounded, masked</text>
  <text class="s" x="305" y="206">providers per module</text>
  <text class="s" x="305" y="232" font-weight="700">Cost, budget, OTel spans</text>
  <text class="s" x="305" y="250">audit of every model call</text>

  <rect class="llm" x="570" y="42" width="300" height="130" rx="10"/>
  <text class="t" x="585" y="68" font-weight="700">Claude workflows</text>
  <text class="s" x="585" y="90">Anthropic API, or a tool-less worker</text>
  <text class="s" x="585" y="112">structured output, validated (Pydantic)</text>
  <text class="s" x="585" y="130">untrusted text wrapped in tags</text>
  <text class="s" x="585" y="148">capture, classify, brief, review, draft</text>
  <text class="s" x="585" y="164" font-style="italic">no tool-calling loop</text>

  <rect class="gate" x="570" y="212" width="300" height="68" rx="10"/>
  <text class="t" x="585" y="238" font-weight="700">Inbox: proposals</text>
  <text class="s" x="585" y="258">checked against what the model was shown</text>
  <text class="s" x="585" y="272">nothing is written yet</text>

  <rect class="gate" x="570" y="330" width="300" height="60" rx="30"/>
  <text class="t" x="720" y="357" text-anchor="middle" font-weight="700">You: confirm or reject</text>
  <text class="s" x="720" y="376" text-anchor="middle">autonomy ceiling L2 (propose)</text>

  <rect class="store" x="290" y="330" width="190" height="60" rx="10"/>
  <text class="t" x="305" y="357" font-weight="700">Applied changes</text>
  <text class="s" x="305" y="376">people, debts, promises</text>

  <text class="h" x="30" y="428">INTERFACES</text>
  <rect class="box" x="30" y="440" width="130" height="44" rx="8"/><text class="t" x="95" y="467" text-anchor="middle">Web (HTMX)</text>
  <rect class="box" x="175" y="440" width="130" height="44" rx="8"/><text class="t" x="240" y="467" text-anchor="middle">iOS Shortcuts</text>
  <rect class="box" x="320" y="440" width="130" height="44" rx="8"/><text class="t" x="385" y="467" text-anchor="middle">ntfy push</text>
  <rect class="box" x="465" y="440" width="130" height="44" rx="8"/><text class="t" x="530" y="467" text-anchor="middle">ICS feed</text>
  <rect class="box" x="610" y="440" width="260" height="44" rx="8"/><text class="t" x="740" y="460" text-anchor="middle">MCP: get_context, read-only</text><text class="s" x="740" y="476" text-anchor="middle">scoped token, audit log</text>

  <path class="l" marker-end="url(#a)" d="M200 68H290"/><path class="l" marker-end="url(#a)" d="M200 130H290"/>
  <path class="l" marker-end="url(#a)" d="M200 192H290"/><path class="l" marker-end="url(#a)" d="M200 254H290"/>
  <path class="l" marker-end="url(#a)" d="M480 100H570"/><text class="s" x="487" y="92">snapshot</text>
  <path class="l" marker-end="url(#a)" d="M720 172V212"/>
  <path class="l" marker-end="url(#a)" d="M720 280V330"/>
  <path class="l" marker-end="url(#a)" d="M570 360H480"/>
  <path class="l" marker-end="url(#a)" d="M385 390V440" stroke-dasharray="4 3"/>
  <path class="l" marker-end="url(#a)" d="M385 280V330" stroke-dasharray="4 3"/>
</svg>
